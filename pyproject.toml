[project]
name = "oko"
version = "0.1.0"
description = "An app for short, local-first study sessions with your own flashcards"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Qu1nel (Ivan Kovach)" }
]
requires-python = ">=3.15"
dependencies = [
    "django>=6.1.3,<6.2",
    "fsrs>=6.3.2,<7",
    "loguru>=0.7.3,<0.8",
]

[project.scripts]
oko = "oko:main"

[dependency-groups]
dev = [
    "django-types==0.24.0",
    "pre-commit==4.7.0",
    "ruff==0.17.4",
    "ty==0.0.99",
]

[tool.ruff]
line-length = 120
target-version = "py315"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.src]
include = ["src", "scripts", "tests"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
